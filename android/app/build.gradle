// تطبيقا «دليل المعامل» على كوكل بلاي: يفتحان الموقع نفسه بشاشة كاملة (Trusted Web Activity).
// customer = تطبيق الزبائن، kitchen = تطبيق المطاعم لاستلام الطلبات.
// التوقيع: من متغيرات البيئة (أسرار GitHub) ALMAMEL_KEYSTORE_FILE و ALMAMEL_KEYSTORE_PASSWORD؛ بدونها يُبنى بتوقيع تجريبي.
plugins { id 'com.android.application' }

def site = (project.findProperty('siteUrl') ?: 'https://almamel.pages.dev').toString().replaceAll('/+$', '')
def host = new URI(site).host
def ksFile = System.getenv('ALMAMEL_KEYSTORE_FILE')
def ksPass = System.getenv('ALMAMEL_KEYSTORE_PASSWORD')
def vCode = (project.findProperty('versionCode') ?: '1').toString().toInteger()

android {
    namespace 'com.almamel.twa'
    compileSdk 36

    defaultConfig {
        minSdk 23
        targetSdk 36
        versionCode vCode
        versionName "1.0.${vCode}"
        manifestPlaceholders = [hostName: host]
        resValue 'string', 'siteUrl', site
        resValue 'string', 'assetStatements',
            "[{ \\\"relation\\\": [\\\"delegate_permission/common.handle_all_urls\\\"], \\\"target\\\": {\\\"namespace\\\": \\\"web\\\", \\\"site\\\": \\\"https://${host}\\\"}}]"
    }

    flavorDimensions = ['app']
    productFlavors {
        customer {
            dimension 'app'
            applicationId 'com.almamel.dalil'
            resValue 'string', 'launchUrl', "${site}/?utm_source=android_app"
            manifestPlaceholders += [pathPrefix: '/']
        }
        kitchen {
            dimension 'app'
            applicationId 'com.almamel.restaurant'
            resValue 'string', 'launchUrl', "${site}/mat3am/kitchen/"
            manifestPlaceholders += [pathPrefix: '/mat3am']
        }
    }

    signingConfigs {
        release {
            if (ksFile && ksPass) {
                storeFile file(ksFile)
                storePassword ksPass
                keyAlias 'almamel'
                keyPassword ksPass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig (ksFile && ksPass) ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { resValues true }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'com.google.androidbrowserhelper:locationdelegation:1.1.1'
}
