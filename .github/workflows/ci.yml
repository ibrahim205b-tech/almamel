name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Start PostgreSQL (for the Supabase security tests)
        run: |
          sudo systemctl start postgresql
          sudo -u postgres createuser -s "$USER"
          chmod o+rx "$HOME" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/supabase" "$GITHUB_WORKSPACE/supabase/test" || true
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit, integration and security tests
        run: npm test
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
