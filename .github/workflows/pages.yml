# يبني الموقع الثابت من content/ وينشره على GitHub Pages مع كل تغيير في main.
# مرة واحدة فقط: Settings ← Pages ← Source: GitHub Actions
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # كل ربع ساعة: يُعاد البناء فقط إذا تغيّرت بيانات Supabase (ويبقى المشروع المجاني نشطاً)
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write # لدفع النسخة الجاهزة إلى فرع cf-pages (Cloudflare Pages)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: check
        name: Check for new content
        run: node scripts/check-changes.ts
        env:
          EVENT: ${{ github.event_name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - if: steps.check.outputs.build == 'true'
        run: npm ci
      # إذا كان مصدر Pages «Deploy from a branch» يُعرض ملف README كنص فقط.
      # هذه الخطوة تحاول تحويل المصدر إلى GitHub Actions تلقائياً.
      - name: Use GitHub Actions as the Pages source
        if: steps.check.outputs.build == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type || echo none)
          echo "Pages build_type: $current"
          if [ "$current" != "workflow" ]; then
            gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow && echo "Switched to GitHub Actions"
          fi
      - id: pages
        if: steps.check.outputs.build == 'true'
        uses: actions/configure-pages@v5
      - if: steps.check.outputs.build == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/supabase-media
          key: supabase-media-${{ github.run_id }}
          restore-keys: supabase-media-
      - name: Build static site
        if: steps.check.outputs.build == 'true'
        run: node scripts/build-static.ts
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Build admin site (/idara, not linked from the public site)
        if: steps.check.outputs.build == 'true'
        run: node scripts/build-static.ts
        env:
          ADMIN_SITE: '1'
          SITE_URL: ${{ steps.pages.outputs.base_url }}/idara
          PUBLIC_URL: ${{ steps.pages.outputs.base_url }}/
          OUT_DIR: dist/idara
      - name: Build private shop registration page (/tasjeel, link sent to customers)
        if: steps.check.outputs.build == 'true'
        run: node scripts/build-static.ts
        env:
          REGISTER_SITE: '1'
          SITE_URL: ${{ steps.pages.outputs.base_url }}/tasjeel
          PUBLIC_URL: ${{ steps.pages.outputs.base_url }}/
          OUT_DIR: dist/tasjeel
      - name: Build restaurant orders site (/mat3am, for restaurants only)
        if: steps.check.outputs.build == 'true'
        run: node scripts/build-static.ts
        env:
          KITCHEN_SITE: '1'
          SITE_URL: ${{ steps.pages.outputs.base_url }}/mat3am
          PUBLIC_URL: ${{ steps.pages.outputs.base_url }}/
          OUT_DIR: dist/mat3am
      # نسخة جاهزة لـ Cloudflare Pages: تُبنى هنا (البناء على Cloudflare يفشل بخطأ داخلي عندهم)
      # وتُدفع إلى فرع cf-pages؛ مشروع Cloudflare ينشر هذا الفرع كما هو بلا أمر بناء.
      - name: Build Cloudflare copy (public + /idara + /tasjeel + /mat3am)
        if: steps.check.outputs.build == 'true'
        env:
          CF: ${{ vars.CF_SITE_URL || 'https://almamel.pages.dev' }}
        run: |
          SITE_URL="$CF" OUT_DIR=dist-cf node scripts/build-static.ts
          ADMIN_SITE=1 SITE_URL="$CF/idara" PUBLIC_URL="$CF/" OUT_DIR=dist-cf/idara node scripts/build-static.ts
          REGISTER_SITE=1 SITE_URL="$CF/tasjeel" PUBLIC_URL="$CF/" OUT_DIR=dist-cf/tasjeel node scripts/build-static.ts
          KITCHEN_SITE=1 SITE_URL="$CF/mat3am" PUBLIC_URL="$CF/" OUT_DIR=dist-cf/mat3am node scripts/build-static.ts
      - name: Push Cloudflare copy to the cf-pages branch
        if: steps.check.outputs.build == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist-cf
          git init -q -b cf-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Built site for Cloudflare Pages (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" cf-pages
      # نشر مباشر على Cloudflare Pages إذا أُضيف المفتاحان في أسرار المستودع:
      # CLOUDFLARE_API_TOKEN (صلاحية Cloudflare Pages: Edit) و CLOUDFLARE_ACCOUNT_ID.
      # المشروع يُنشأ تلقائياً أول مرة (CF_PROJECT، الافتراضي almamel).
      - name: Deploy to Cloudflare Pages (when the API token secret is set)
        if: steps.check.outputs.build == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PROJECT || 'almamel' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set; skipping direct deploy (the cf-pages branch is still updated)."
            exit 0
          fi
          rm -rf dist-cf/.git
          npx --yes wrangler@3 pages project create "$PROJECT" --production-branch main 2>/dev/null || true
          npx --yes wrangler@3 pages deploy dist-cf --project-name "$PROJECT" --branch main --commit-dirty=true
      - if: steps.check.outputs.build == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.build == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
